<footer class="border-t border-zinc-900">

  <div class="container py-10">

    <div
      class="flex flex-col
             gap-8
             md:flex-row
             md:items-center
             md:justify-between"
    >

      <div>

        <a
          href="/"
          (click)="onBrandClick($event)"
          class="group flex items-center gap-3"
          aria-label="Pedro Lustosa - início"
        >

          <img
            src="/logo-pedrolustosa.png"
            alt="Pedro Lustosa"
            class="h-8 w-8
                   object-contain
                   transition-transform
                   duration-200
                   group-hover:scale-105"
          />

          <span
            class="text-sm
                   font-medium
                   text-zinc-300
                   transition-colors
                   duration-200
                   group-hover:text-white"
          >
            Pedro Lustosa
          </span>

        </a>

        <p
          class="mt-3 text-xs
                 text-zinc-500"
        >
          Software Engineer · Full Stack Developer
        </p>

      </div>


      <div
        class="flex flex-wrap gap-5"
      >

        <a
          href="#about"
          class="text-xs text-zinc-400
                 transition hover:text-zinc-100"
        >
          Sobre
        </a>

        <a
          href="#skills"
          class="text-xs text-zinc-400
                 transition hover:text-zinc-100"
        >
          Skills
        </a>

        <a
          href="#projects"
          class="text-xs text-zinc-400
                 transition hover:text-zinc-100"
        >
          Projetos
        </a>

        <a
          href="#experience"
          class="text-xs text-zinc-400
                 transition hover:text-zinc-100"
        >
          Experiência
        </a>

        <a
          href="#journey"
          class="text-xs text-zinc-400
                 transition hover:text-zinc-100"
        >
          Jornada
        </a>

        <a
          href="#education"
          class="text-xs text-zinc-400
                 transition hover:text-zinc-100"
        >
          Formação
        </a>

        <a
          href="#certifications"
          class="text-xs text-zinc-400
                 transition hover:text-zinc-100"
        >
          Certificações
        </a>

        <a
          href="#contact"
          class="text-xs text-zinc-400
                 transition hover:text-zinc-100"
        >
          Contato
        </a>

      </div>

    </div>


    <div
      class="mt-10 flex flex-col
             gap-2
             border-t border-zinc-900
             pt-6
             text-xs text-zinc-500
             sm:flex-row
             sm:items-center
             sm:justify-between"
    >

      <p>
        © {{ year }} Pedro Lustosa.
        Todos os direitos reservados.
      </p>

      <p
        class="flex items-center
               justify-center
               gap-2"
      >
        Built with Angular 20

        <app-icon name="angular" />
      </p>

    </div>

  </div>

</footer>
