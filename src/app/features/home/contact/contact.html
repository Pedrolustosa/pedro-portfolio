<section
  id="contact"
  appScrollReveal
  class="border-t border-slate-900
         py-24 sm:py-32"
>

  <div class="container">

    <div
      class="relative overflow-hidden
             rounded-3xl
             border border-blue-400/20
             bg-[#0f141d]"
    >

      <div
        class="pointer-events-none
               absolute left-1/2 top-0
               h-80 w-80
               -translate-x-1/2
               rounded-full
               bg-blue-500/10
               blur-3xl"
      ></div>


      <div
        class="relative
               px-6 py-16
               text-center
               sm:px-12
               sm:py-24"
      >

        <p
          class="text-xs
                 font-medium
                 uppercase
                 tracking-[0.3em]
                 text-blue-400/70"
        >
          08 — Contato
        </p>


        <h2
          class="mx-auto mt-5
                 max-w-3xl
                 text-4xl
                 font-semibold
                 tracking-tight
                 text-white
                 sm:text-5xl
                 lg:text-6xl"
        >
          Vamos construir algo

          <span
            class="bg-gradient-to-r
                   from-blue-300
                   to-blue-500
                   bg-clip-text
                   text-transparent"
          >
            juntos?
          </span>
        </h2>


        <p
          class="mx-auto mt-6
                 max-w-xl
                 text-base
                 leading-relaxed
                 text-slate-400
                 sm:text-lg"
        >
          Estou aberto a conversar sobre projetos,
          oportunidades e ideias relacionadas a
          tecnologia e engenharia de software.
        </p>


        <div
          class="mt-10
                 flex flex-col
                 items-center
                 justify-center
                 gap-3
                 sm:flex-row"
        >

          @for (
            contact of contactLinks;
            track contact.label
          ) {

            <a
              [href]="contact.url"
              [target]="
                contact.external
                  ? '_blank'
                  : null
              "
              [rel]="
                contact.external
                  ? 'noopener noreferrer'
                  : null
              "
              class="group flex
                     w-full max-w-xs
                     items-center
                     justify-between
                     gap-3
                     rounded-full
                     border border-slate-700
                     bg-slate-900/80
                     px-5 py-3
                     transition-all
                     duration-300
                     hover:-translate-y-0.5
                     hover:border-blue-400/50
                     hover:bg-blue-500/10
                     sm:w-auto"
            >

              <span
                class="flex items-center gap-3"
              >

                <app-icon
                  [name]="contact.icon"
                  class="text-blue-300"
                />

                <span
                  class="text-sm
                         font-medium
                         text-slate-200
                         transition-colors
                         duration-200
                         group-hover:text-blue-200"
                >
                  {{ contact.label }}
                </span>

              </span>


              <app-icon
                name="arrow-up-right"
                class="text-slate-500
                       transition-all
                       duration-200
                       group-hover:translate-x-1
                       group-hover:text-blue-300"
              />

            </a>

          }

        </div>

      </div>

    </div>

  </div>

</section>
