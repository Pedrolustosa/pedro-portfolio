<section
  id="journey"
  appScrollReveal
  class="border-t border-zinc-900 py-24 sm:py-32"
>
  <div class="container">

    <div class="max-w-2xl">

      <p
        class="text-xs font-medium uppercase
               tracking-[0.3em] text-zinc-400"
      >
        05 — Jornada
      </p>

      <h2
        class="mt-4 text-3xl font-semibold
               tracking-tight text-white
               sm:text-4xl"
      >
        Uma trajetória em
        <span class="text-zinc-400">
          constante evolução.
        </span>
      </h2>

      <p
        class="mt-6 text-sm leading-relaxed
               text-zinc-500"
      >
        Da infraestrutura ao desenvolvimento de
        software, passando por dados, arquitetura,
        cloud e inteligência artificial.
      </p>

    </div>


    <div
      class="mt-16 overflow-hidden
             rounded-2xl
             border border-zinc-800"
    >

      <div
        class="grid divide-y divide-zinc-800
               md:grid-cols-2
               md:divide-x
               md:divide-y-0
               lg:grid-cols-3"
      >

        @for (
          step of steps;
          track step.year
        ) {

          <article
            class="group relative
                   bg-zinc-950
                   p-7
                   transition
                   hover:bg-zinc-900/60"
          >

            <span
              class="font-mono text-sm
                     text-zinc-400
                     transition-colors
                     group-hover:text-zinc-400"
            >
              {{ step.year }}
            </span>


            <div
              class="mt-6 h-px w-8
                     bg-zinc-800
                     transition-all
                     duration-300
                     group-hover:w-16
                     group-hover:bg-zinc-500"
            ></div>


            <h3
              class="mt-6 text-lg
                     font-semibold
                     text-white"
            >
              {{ step.title }}
            </h3>


            <p
              class="mt-3 text-sm
                     leading-relaxed
                     text-zinc-500"
            >
              {{ step.description }}
            </p>

          </article>

        }

      </div>

    </div>

  </div>
</section>
