<section
  id="education"
  appScrollReveal
  class="border-t border-zinc-900 py-24 sm:py-32"
>
  <div class="container">

    <div
      class="grid gap-8
             lg:grid-cols-[0.7fr_1.3fr]"
    >

      <div>

        <p
          class="text-xs font-medium uppercase
                 tracking-[0.3em] text-zinc-400"
        >
          06 — Formação
        </p>

        <h2
          class="mt-4 text-3xl font-semibold
                 tracking-tight text-white
                 sm:text-4xl"
        >
          Formação
          <span class="text-zinc-400">
            acadêmica.
          </span>
        </h2>

      </div>

      <p
        class="max-w-xl text-sm
               leading-relaxed
               text-zinc-500"
      >
        Formação construída entre tecnologia,
        desenvolvimento de software, dados e
        inteligência artificial.
      </p>

    </div>


    <div
      class="mt-16 grid gap-4
             md:grid-cols-2"
    >

      @for (
        item of education;
        track item.title
      ) {

        <article
          class="group rounded-2xl
                 border border-zinc-800
                 bg-zinc-950
                 p-7
                 transition-all duration-300
                 hover:-translate-y-1
                 hover:border-zinc-700
                 hover:bg-zinc-900/60"
        >

          <div
            class="flex items-start
                   justify-between gap-4"
          >

            <span
              class="rounded-full
                     border border-zinc-800
                     bg-zinc-900
                     px-3 py-1
                     text-[10px]
                     font-medium
                     uppercase
                     tracking-wider
                     text-zinc-500"
            >
              {{ item.type }}
            </span>

            <span
              class="font-mono text-xs
                     text-zinc-400"
            >
              {{ item.start }} — {{ item.end }}
            </span>

          </div>


          <h3
            class="mt-8 text-lg
                   font-semibold
                   leading-relaxed
                   text-white"
          >
            {{ item.title }}
          </h3>


          <p
            class="mt-3 text-sm
                   font-medium
                   text-zinc-400"
          >
            {{ item.institution }}
          </p>


          <p
            class="mt-1 text-xs
                   text-zinc-400"
          >
            {{ item.location }}
          </p>


          <div
            class="mt-8 h-px w-8
                   bg-zinc-800
                   transition-all duration-300
                   group-hover:w-16
                   group-hover:bg-zinc-500"
          ></div>

        </article>

      }

    </div>

  </div>
</section>
